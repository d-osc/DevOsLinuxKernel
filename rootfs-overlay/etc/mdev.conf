# /etc/mdev.conf — DevOs device permissions
null         root:root  666
zero         root:root  666
full         root:root  666
random       root:root  444
urandom      root:root  444
console      root:tty   600
ptmx         root:tty   666
tty          root:tty   666
tty[0-9]*    root:tty   660
ttyAMA[0-9]* root:tty   660
ttyS[0-9]*   root:tty   660
sd[a-z]*     root:disk  660
vd[a-z]*     root:disk  660
sr[0-9]*     root:cdrom 660
